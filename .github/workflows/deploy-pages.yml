# Builds the site and publishes it to GitHub Pages on every push to main/master.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site will be at https://<user>.github.io/<repo>/ (the editor at …/admin).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for the repo's sub-folder
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages shows 404.html for addresses it doesn't know (/queue, /admin, …);
      # making it the app itself lets the site open those pages directly.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
